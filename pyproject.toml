[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scgt"
version = "1.0.0"
description = "scgt - SINE-RIP chip genotyper, a bioinformatics tool for 51k-SINE-RIP chip genotyping"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Mobilome Team"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
scgt = "scgt_modules.cli:main"

[project.urls]
Homepage = "https://github.com/mobilome/scgt"
Repository = "https://github.com/mobilome/scgt"

[tool.setuptools.packages.find]
include = ["scgt_modules*"]

[tool.setuptools.package-data]
scgt_modules = ["data/*"]
